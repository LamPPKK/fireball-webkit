name: FireballWebKit
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FireballWebKit:
    type: application
    platform: iOS
    sources:
      - App
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fireball.browser
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        FIREBALL_BLOCKER_MANIFEST_URL: https://lamppkk.github.io/fireball-webkit/blocker/manifest-v1.json
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGN_ENTITLEMENTS: Config/FireballDebug.entitlements
          FIREBALL_CLOUDKIT_ENABLED: NO
          FIREBALL_BLOCKER_UPDATES_ENABLED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_ENTITLEMENTS: Config/FireballRelease.entitlements
          FIREBALL_CLOUDKIT_ENABLED: YES
          FIREBALL_BLOCKER_UPDATES_ENABLED: YES
  FireballWebKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: FireballWebKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fireball.browser.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  FireballWebKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: FireballWebKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fireball.browser.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  FireballWebKit:
    build:
      targets:
        FireballWebKit: all
        FireballWebKitTests: [test]
    test:
      targets:
        - FireballWebKitTests
        - FireballWebKitUITests
      environmentVariables:
        FIREBALL_RULE_ARTIFACT_DIRECTORY: $(FIREBALL_RULE_ARTIFACT_DIRECTORY)
        FIREBALL_BLOCKER_MANIFEST: $(FIREBALL_BLOCKER_MANIFEST)
        FIREBALL_BLOCKER_ARTIFACT_DIRECTORY: $(FIREBALL_BLOCKER_ARTIFACT_DIRECTORY)
        FIREBALL_BLOCKER_PUBLIC_KEY_BASE64: $(FIREBALL_BLOCKER_PUBLIC_KEY_BASE64)
