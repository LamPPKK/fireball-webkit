name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select supported simulators
        run: |
          printf 'FIREBALL_IPHONE_UDID=%s\n' "$(python3 Tools/select_simulator.py --family iphone)" >> "$GITHUB_ENV"
          printf 'FIREBALL_IPAD_UDID=%s\n' "$(python3 Tools/select_simulator.py --family ipad)" >> "$GITHUB_ENV"
      - name: Unit and accessibility UI tests on iPhone
        run: |
          xcodebuild -project FireballWebKit.xcodeproj \
            -scheme FireballWebKit \
            -destination "platform=iOS Simulator,id=$FIREBALL_IPHONE_UDID" \
            CODE_SIGNING_ALLOWED=NO test
      - name: Adaptive build on iPad
        run: |
          xcodebuild -project FireballWebKit.xcodeproj \
            -scheme FireballWebKit \
            -destination "platform=iOS Simulator,id=$FIREBALL_IPAD_UDID" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Accessibility and hardware-keyboard UI tests on iPad
        run: |
          xcodebuild -project FireballWebKit.xcodeproj \
            -scheme FireballWebKit \
            -destination "platform=iOS Simulator,id=$FIREBALL_IPAD_UDID" \
            -only-testing:FireballWebKitUITests/BrowserSmokeUITests/testBrowserChromePassesAccessibilityAudit \
            -only-testing:FireballWebKitUITests/BrowserSmokeUITests/testIPadHardwareKeyboardCreatesTabAndFocusesAddressBar \
            CODE_SIGNING_ALLOWED=NO test

  blocker-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s Tools/tests
      - run: python3 -m py_compile Tools/blocker_release_version.py Tools/build_blocker.py Tools/create_blocker_manifest.py Tools/release_preflight.py Tools/select_simulator.py Tools/verify_ipa.py

  configuration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: plutil -lint Resources/PrivacyInfo.xcprivacy Config/*.plist Config/*.entitlements
      - run: git diff --check
