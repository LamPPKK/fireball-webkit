name: pages

on:
  push:
    branches: [main]
    paths: [docs/**, Blocker/manifest.schema.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site with latest signed blocker release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/blocker
          cp -R docs/. site/
          cp Blocker/manifest.schema.json site/blocker-manifest-v1.schema.json
          gh release list --limit 100 --json tagName > "$RUNNER_TEMP/blocker-releases.json"
          tag="$(python3 Tools/blocker_release_version.py \
            --releases-json "$RUNNER_TEMP/blocker-releases.json" \
            --print-latest)"
          if [ -n "$tag" ]; then
            version="${tag#blocker-}"
            mkdir -p "site/blocker/$version"
            gh release download "$tag" --dir "site/blocker/$version" --pattern 'content-rules-*.json'
            gh release download "$tag" --dir site/blocker --pattern 'manifest-v1.json' --pattern 'conversion-report.json'
          fi
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
